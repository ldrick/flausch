name: Android SDK updates

# Dependabot doesn't know the Android SDK: compare android/sdk.env with the newest stable packages once a month
# and open (or update) an issue when something is newer.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare with the newest stable versions
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Android SDK updates available
        run: |
          . android/sdk.env
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=0 > list.txt 2>/dev/null
          # Older sdkmanager versions separate with ";", newer ones with "/". Previews (-beta, -rc) and
          # extension levels (-ext) are skipped.
          newest() {
            grep -oE "^ *$1[;/]$2[0-9.]+( |$)" list.txt | sed -E "s/^ *$1[;\/]$2//; s/ $//" \
              | grep -E "^$3$" | sort -V | tail -1
          }
          platform=$(newest platforms android- '[0-9]+(\.[0-9]+)?')
          build_tools=$(newest build-tools '' '[0-9]+\.[0-9]+\.[0-9]+')
          ndk=$(newest ndk '' '[0-9]+\.[0-9]+\.[0-9]+')
          body=""
          check() {
            if [ -n "$3" ] && [ "$2" != "$3" ] && [ "$(printf '%s\n%s\n' "$2" "$3" | sort -V | tail -1)" = "$3" ]; then
              body+="- $1: $2 → $3"$'\n'
            fi
          }
          check "Platform (ANDROID_PLATFORM, targetSdk)" "${ANDROID_PLATFORM#android-}" "$platform"
          check "Build tools" "$ANDROID_BUILD_TOOLS_VERSION" "$build_tools"
          check "NDK" "$ANDROID_NDK_VERSION" "$ndk"
          if [ -z "$body" ]; then
            echo "Up to date"
            exit 0
          fi
          body="Newer stable Android SDK packages are available:"$'\n\n'"$body"$'\n'"Update \`android/sdk.env\`; a new platform also needs \`target_sdk_version\` in \`Cargo.toml\` and the F-Droid recipe (\`cargo test\` checks both). Build and test on the emulator."
          echo "$body"
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
