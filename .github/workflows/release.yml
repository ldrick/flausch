name: Release

# Every push to main updates the release PR "chore: release vX.Y.Z" on the branch release/next (or opens it once
# there is a feat or fix to release). Changelogs edited in the PR are kept when main moves on. Merging the PR tags
# the version, creates the GitHub release and attaches the signed APK. Run the workflow by hand to pick a version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (empty = next version from the commits since the last tag, 1.0.0 for the first)
        required: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Update the release PR
    if: >-
      github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: release/next
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Bump the version and write the changelogs
        id: release
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          keep=()
          # Only an open PR has edits to keep; the branch of a merged or closed one is stale.
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" != 0 ]; then
            git fetch origin "$BRANCH"
            keep=(--keep FETCH_HEAD)
          fi
          version="$(python3 tools/release.py prepare $REQUESTED "${keep[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open or update the pull request
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "chore: release v$VERSION"
          git push --force origin "$BRANCH"
          title="chore: release v$VERSION"
          body="$(printf '%s\n\n%s\n\n%s' \
            "Release v$VERSION. Every push to main updates this PR. Before merging, edit the user-facing texts in \`fastlane/metadata/android/{en-US,de-DE}/changelogs/\` (max. 500 characters; the German one starts with TODO until it is translated). Your edits are kept, and later features and fixes are appended to them; other edits, e.g. in \`CHANGELOG.md\`, are overwritten." \
            "Merging tags \`v$VERSION\`, creates the GitHub release and attaches the APK." \
            "$(python3 tools/release.py notes "$VERSION")")"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = 0 ]; then
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          else
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          fi
          # Pushes with GITHUB_TOKEN don't trigger workflows, so start CI by hand.
          gh workflow run ci.yml --ref "$BRANCH"

  publish:
    name: Tag, release and APK
    if: >-
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged"
            exit 1
          fi
      - name: Create the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/release.py notes "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Flausch $VERSION" --notes-file notes.md
      - run: rustup toolchain install
        if: env.KEYSTORE != ''
      - name: Android SDK, NDK and JDK
        if: env.KEYSTORE != ''
        run: |
          . android/sdk.env
          grep -v '^#' android/sdk.env >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        if: env.KEYSTORE != ''
        with:
          tool: cargo-apk@0.10.0
      - name: Build and attach the signed APK
        if: env.KEYSTORE != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # Same paths as the F-Droid recipe, so F-Droid's build matches this APK and ships our signature.
          RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo" \
            CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks" \
            CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            cargo apk build --lib --locked --release --target aarch64-linux-android
          cp target/release/apk/flausch.apk "flausch-$VERSION.apk"
          gh release upload "v$VERSION" "flausch-$VERSION.apk"
      - name: No keystore
        if: env.KEYSTORE == ''
        run: echo "::warning::RELEASE_KEYSTORE is not set, so the release has no APK"
