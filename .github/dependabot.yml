version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Same minimum age as .cargo/config.toml (registry.global-min-publish-age).
    cooldown:
      default-days: 3
    ignore:
      # Only enables a feature on Slint's copy, so it must stay on the version Slint uses (see Cargo.toml).
      - dependency-name: fontique
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
