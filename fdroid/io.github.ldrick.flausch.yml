AutoName: Flausch

RepoType: git
Repo: https://github.com/ldrick/flausch.git
Binaries: https://github.com/ldrick/flausch/releases/download/v%v/flausch-%v.apk

Builds:
  - versionName: 2.0.0
    versionCode: 16908288
    commit: v2.0.0
    sudo:
      - apt-get update
      - apt-get install -y build-essential openjdk-21-jdk-headless
    output: target/release/apk/flausch.apk
    srclibs:
      - rustup@1.29.3
    prebuild: sdkmanager "platforms;android-36" "build-tools;36.0.0"
    build:
      - export RUSTUP_TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain $RUSTUP_TOOLCHAIN
        --target aarch64-linux-android
      - source $HOME/.cargo/env
      - cargo install --locked cargo-apk@0.10.0
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 ANDROID_HOME=$$SDK$$ ANDROID_NDK_ROOT=$$NDK$$
      - export ANDROID_PLATFORM=android-36 ANDROID_BUILD_TOOLS_VERSION=36.0.0
      - cargo fetch --locked
      - keytool -genkeypair -keystore $HOME/throwaway.jks -storepass android -keypass
        android -alias flausch -dname CN=flausch -keyalg RSA -validity 10000
      - export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME/.cargo=/cargo"
      - CARGO_APK_RELEASE_KEYSTORE=$HOME/throwaway.jks CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
        cargo apk build --lib --release --target aarch64-linux-android
    ndk: 30.0.16248370

AllowedAPKSigningKeys: c0f7ea99292ef05c121d4ec2cc9d44d4fb99b3df3b7946fd1e332f715935580e

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: Cargo.toml|version_code = (\d+)|Cargo.toml|\nversion = "(.+)"
