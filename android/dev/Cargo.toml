# "Flausch Dev": the debug build as its own app (`make apk`, `make install`), so it installs next to the store
# version with its own data. Only the Android metadata differs from ../../Cargo.toml; a test keeps the rest in sync.
[package]
name = "flausch-dev"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
flausch = { path = "../.." }

[package.metadata.android]
package = "io.github.ldrick.flausch.debug"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 36

[package.metadata.android.application]
label = "Flausch Dev"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|screenLayout|smallestScreenSize|uiMode|density|fontScale|locale|layoutDirection"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT"]
data = [{ mime_type = "application/pdf" }]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT"]
data = [{ mime_type = "application/pdf" }]
