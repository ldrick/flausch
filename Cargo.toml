[package]
name = "noste"
version = "0.1.0"
edition = "2024"
description = "A crochet app for Android"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "noste"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "7"
hayro = "0.9"
rfd = "0.18"
sys-locale = "0.3"

# Desktop Linux: load fontconfig at runtime instead of linking it, so no pkg-config/fontconfig headers are needed.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "1.18.1"
android-build = "0.1.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true

# cargo-apk
[package.metadata.android]
package = "io.github.ldrick.noste"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 36

[package.metadata.android.application]
label = "nøste"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
# Handle these changes in place instead of recreating the NativeActivity.
config_changes = "orientation|keyboardHidden|keyboard|screenSize|screenLayout|smallestScreenSize|uiMode|density|fontScale|locale|layoutDirection"

