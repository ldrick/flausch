[package]
name = "noste"
version = "0.1.0"
edition = "2024"
description = "A crochet app for Android"
license = "GPL-3.0-or-later"
repository = "https://github.com/ldrick/noste"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "noste"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "7"
hayro = "0.9"
rfd = "0.18"
sys-locale = "0.3"

# Desktop Linux: load fontconfig at runtime instead of linking it, so no pkg-config/fontconfig headers are needed.
# Must match the fontique version Slint uses (`cargo tree -i fontique`), otherwise the feature doesn't reach Slint.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "1.18.1"
android-build = "0.1.4"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Slint uses i32/f32 for counts and sizes, so numeric casts are expected.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
print_stdout = "warn"

[profile.release]
lto = true
strip = true

# cargo-apk
[package.metadata.android]
package = "io.github.ldrick.noste"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 36

[package.metadata.android.application]
label = "nøste"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
# Handle these changes in place instead of recreating the NativeActivity.
config_changes = "orientation|keyboardHidden|keyboard|screenSize|screenLayout|smallestScreenSize|uiMode|density|fontScale|locale|layoutDirection"

