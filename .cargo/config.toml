# Only resolve crate versions published at least 3 days ago (supply-chain safety: time for yanks and advisories).
# Versions already in Cargo.lock stay usable. Override for an urgent fix with
# `CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE=0 cargo update -p <crate>`. Dependabot uses the same cooldown.
[registry]
global-min-publish-age = "3 days"
